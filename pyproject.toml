[project]
name = "eduagent"
version = "0.1.0"
description = "Local study companion: Google ADK agents, NiceGUI UI, Gemini/Ollama"
readme = "README.md"
authors = [
    { name = "Yash Dani", email = "yash.dani0406@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "google-adk>=2.13.0",
    "httpx>=0.28.1",
    "litellm>=1.108.1",
    "nicegui>=4.0.0",
    "pydantic-settings>=2.16.2",
    "tzdata>=2026.6",
]

[project.scripts]
eduagent = "eduagent.launcher:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
